<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookmarks</title>
  <meta name="description" content="Persoonlijke startpagina met snelkoppelingen, pagina's en cards.">
  <meta name="theme-color" content="#9E86FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bookmarks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Zelfde logica als applyTheme() in js/app.js, hier vroeg om flitsen te voorkomen.
    (function () {
      var t = '';
      try { t = localStorage.getItem('theme') || ''; } catch (e) {}
      if (['light', 'dark', 'neon', 'ocean', 'forest', 'sunset'].indexOf(t) < 0) {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="app"><div class="splash"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
